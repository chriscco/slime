name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and release notes format
        run: |
          git fetch origin main --tags
          scripts/check-release "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY"
      - run: scripts/test
      - run: python3 -m unittest discover -s scripts/tests
      - name: Import release signing identity
        timeout-minutes: 2
        env:
          CERTIFICATE_BASE64: ${{ secrets.RELEASE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.RELEASE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.RELEASE_SIGNING_IDENTITY }}
        run: scripts/import-release-signing
      - name: Build and verify arm64 DMG
        env:
          SIGNING_IDENTITY: ${{ secrets.RELEASE_SIGNING_IDENTITY }}
          REQUIRE_SIGNING: '1'
          REQUIRE_UPDATES: '1'
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          test "$(uname -m)" = arm64
          SLIME_VERSION="${GITHUB_REF_NAME#v}" \
            SLIME_BUILD_NUMBER="$(git rev-list --count HEAD)" scripts/package-dmg
          scripts/check-release "$GITHUB_REF_NAME" --bundle build/slime.app/Contents/Info.plist
      - name: Sign and verify update archive and appcast
        env:
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/sign-updates "$GITHUB_REF_NAME"
      - name: Publish reviewed notes and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="slime-$version-arm64.dmg"
          (cd build && shasum -a 256 -c "$image.sha256")
          gh release create "$GITHUB_REF_NAME" "build/$image" "build/$image.sha256" build/appcast.xml \
            --verify-tag --title "slime $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$version.md"
      - name: Remove temporary signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/slime-release.keychain-db"
          if [ -f "$keychain" ]; then security delete-keychain "$keychain"; fi
