name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # 必须 macOS：包里有 import AppKit 的 target，Linux runner 编不过。
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: scripts/test
      - run: python3 -m unittest discover -s scripts/tests

  signing:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Import and use a disposable signing identity
        timeout-minutes: 2
        run: scripts/tests/signing-smoke
      - name: Remove temporary signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/slime-release.keychain-db"
          if [ -f "$keychain" ]; then security delete-keychain "$keychain"; fi

  compatibility:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      # The older runtime still needs a modern SDK to compile guarded glass APIs.
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - run: sw_vers && swift --version
      - run: scripts/test
      - run: python3 -m unittest discover -s scripts/tests
      - run: SIGNING_IDENTITY=- scripts/build-app
      - name: Verify bundle compatibility and launch without requesting permissions
        run: python3 scripts/tests/launch-smoke.py
